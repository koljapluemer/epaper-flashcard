[platformio]
default_envs = blink_8285

[env]
platform = espressif8266
board = esp8285
framework = arduino
lib_deps =
  zinggjm/GxEPD2
upload_speed = 115200
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
upload_resetmethod = nodemcu
monitor_speed = 115200

[env:proto_213]
build_src_filter =
  +<main_213.cpp>

[env:epd_213_smoke]
build_src_filter =
  +<epd_213_smoke.cpp>

[env:blink_8285]
build_src_filter =
  +<blink_8285.cpp>

[env:proto_154]
build_src_filter =
  +<main_154.cpp>

[env:hello_154]
build_src_filter =
  +<hello_154.cpp>

[env:ws_154_v2_check]
build_src_filter =
  +<ws_154_v2_check.cpp>

[env:demo_154g]
; pin esptoolpy to avoid https://github.com/platformio/platform-espressif32/issues/1632
platform_packages = tool-esptoolpy@~1.40501.0
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
; ESP32-S3-PICO-1-N8R8: 8MB QIO Flash + 8MB OPI PSRAM
board_build.flash_size = 8MB
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
; USB-CDC for Serial via the native USB port
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
  zinggjm/GxEPD2
  lewisxhe/SensorLib
build_src_filter =
  +<demo_154g.cpp>
upload_port = /dev/ttyACM1
monitor_port = /dev/ttyACM1
upload_speed = 921600
monitor_speed = 115200
